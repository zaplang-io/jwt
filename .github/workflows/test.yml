name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  assertions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/zaplang-io/zap@sha256:bb5d27aa316d54474f99adb37519efc13f0659dd8cac1304c60daf1a8511cd99
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - run: zap fmt --check src tests
      - run: sh tools/run-tests.sh
      - run: sh tools/check-package.sh
