name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  assertions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # zap main @ 3fda0cdc — adds the #778/#799 private-key PEM builders
    # (rsa/p256/ed25519_private_key_pem) on top of the #729/#757 constant-time
    # compare, the #643/#715 asymmetric crypto primitives (key_info, sign+verify,
    # public-JWK import), and the #727/#728 indexed-collection-store fix.
    container: ghcr.io/zaplang-io/zap@sha256:48acf61d371cb58164c7899e4134a119b77b815bc57dbe06f97d82b30d9e1133
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - run: zap fmt --check src tests
      - run: sh tools/run-tests.sh
      - run: sh tools/check-package.sh
